# 상태 어휘 정본 (v2.51)
# spec-gate·golden-gate·stop-verify-gate·session-start가 모두 이 파일 하나에서 읽는다.
# 이 레포의 실제 표기가 다르면 여기만 넓힌다. 스크립트 안에 어휘를 다시 적지 않는다.
#
# 왜 파일로 뺐나: 어휘를 각 스크립트에 두니 한 곳만 고치고 옆은 놓치는 사고가 반복됐다
#   (golden-gate만 고치고 spec-gate 누락, spec-gate만 고치고 stop 훅·session-start 누락).
#
# 형식: 이름=정규식(ERE, 대소문자 무시). \s 대신 공백+* 를 쓴다(awk·python 공통 문법).
IN_PROGRESS=In Progress|착수|진행 *중|작업 *중
BLOCKED=Blocked|막힘|보류
PLAN_CLOSED=done|완료
RELEASE_CLOSED=done|완료|제출|배포|출시
# 상태 판정 대상에서 빼는 데이터 파일(공백 구분). *.template.md 는 항상 제외.
EXCLUDE=CHANGELOG.md INDEX.md MEASUREMENTS.md BACKLOG-deferred.md HANDOFF.md RETRO.md
